# Restricted zone definitions for point-in-polygon geofencing.
# Coordinates are normalized (0..1) relative to the frame width/height.

# DANGER_ZONE_A is an intentionally static CRITICAL zone. It represents a fixed
# physical area (e.g. a high-voltage cell) and is not generated from detections.
zones:
  DANGER_ZONE_A:
    description: "High-voltage switchyard - no entry without work permit"
    severity: "CRITICAL"
    polygon:
      - [0.40, 0.40]
      - [0.70, 0.40]
      - [0.72, 0.55]
      - [0.65, 0.75]
      - [0.40, 0.75]
    action: "TRIP_RELAY"

# NOTE: machine-following exclusion/danger zones are NOT defined here. They are
# generated dynamically per frame from tracked machine detections in
# src/isip/vision/zones.py and named MACHINE_DANGER_<id>, so the live overlay
# keeps pace with the machine instead of being a fixed polygon stamped on the
# image.