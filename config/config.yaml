edge:
  node_id: "edge-node-01"
  hardware: "nvidia-rtx-5050-laptop"
  inference_backend: "yolov8"          # yolov8 | synthetic
  target_latency_ms: 20
  fps_limit: 30

video:
  source: "We_want_the_vedio_of_the_engin.mp4"
  width: 1280
  height: 720
  save_output: false
  output_dir: "data/output"
  synthetic_camera: false

vision:
  # synthetic (demo) | yolov8 (COCO detect) | yolov8_world (open-vocab) | yolov8_seg
  backend: "yolov8_world"
  model: "yolov8s-world.pt"            # YOLO-World open-vocabulary checkpoint
  conf_threshold: 0.30
  iou_threshold: 0.5
  imgsz: 640
  device: "cuda"
  classes:
    - person
    - helmet
    - safety vest
  machine_classes:
    - machine
    - heavy machinery
    - industrial machinery
    - construction equipment
    - engine
    - engines
    - motor
  ppe_required: ["helmet", "vest"]
  ppe_rules:
    "no-helmet":
      missing: ["helmet"]
      severity: "CRITICAL"
    "no-vest":
      missing: ["vest"]
      severity: "WARNING"
  geofences_file: "config/geofences.yaml"
  segmentation:
    enabled: false                      # true when using a *-seg model
    model: "yolov8n-seg.pt"

tracking:
  enabled: true
  max_age: 10
  iou_threshold: 0.3

dynamic_zones:
  machine_danger:
    enabled: true
    buffer: 0.05
    smoothing: 0.7

visualization:
  show_person_bbox: false
  show_person_polygon: true
  fill_person_polygon: true
  show_machine_bbox: true
  show_machine_zone: true
  show_static_zones: true

iiot:
  sensor_ids:
    - "TMP_BRG_02"
    - "VIB_MTR_01"
    - "GAS_CO_03"
  sampling_interval_s: 1.0
  protocol: "mqtt"                      # mqtt | modbus | emulated
  broker_host: "127.0.0.1"
  broker_port: 1883
  modbus_unit: 1
  thresholds:
    TMP_BRG_02:
      warn: 85.0
      critical: 95.0
    VIB_MTR_01:
      warn: 55.0
      critical: 70.0
    GAS_CO_03:
      warn: 25.0
      critical: 50.0

rul:
  nominal_temp_c: 60.0
  activation_temp_c: 70.0
  max_rated_life_h: 100000.0

control:
  estop_gpio: 17
  relay_channel: "GPIO-3"
  line_id: "LINE_01"
  trip_delay_ms: 0
  use_gpio: false                        # true only on real Jetson/Pi hardware

api:
  host: "0.0.0.0"
  port: 8080
  edge_prefix: "/edge"

dashboard:
  host: "127.0.0.1"
  port: 8501
  refresh_ms: 500

logging:
  audit_dir: "logs"
  level: "INFO"