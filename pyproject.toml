[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isip"
version = "0.1.0"
description = "Industrial Safety Intelligence Platform - edge-first multi-modal safety AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ISIP Team", email = "anandhu@example.com" },
]
dependencies = [
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "ultralytics>=8.2.0",
  "opencv-python>=4.9",
  "streamlit>=1.34",
  "pandas>=2.2",
  "plotly>=5.20",
  "pymodbus>=3.6",
  "paho-mqtt>=1.6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
